{% extends "base.html" %}
{% block title %}Passwort aendern{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-box card">
    <div class="brand">Passwort aendern</div>
    {% if user.must_change_password %}
      <p class="muted">Aus Sicherheitsgruenden musst du dein initiales Passwort jetzt aendern.</p>
    {% endif %}
    {% include "partials/flash.html" %}
    <form method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="current_password">Aktuelles Passwort</label>
        <input type="password" id="current_password" name="current_password" required autofocus>
      </div>
      <div class="field">
        <label for="new_password">Neues Passwort (mind. 10 Zeichen)</label>
        <input type="password" id="new_password" name="new_password" minlength="10" required>
      </div>
      <div class="field">
        <label for="new_password_repeat">Neues Passwort wiederholen</label>
        <input type="password" id="new_password_repeat" name="new_password_repeat" minlength="10" required>
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center;">Passwort aendern</button>
    </form>
  </div>
</div>
{% endblock %}
