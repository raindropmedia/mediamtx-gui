{% extends "base.html" %}
{% block title %}{{ "Neuer Zugang" if is_new else "Zugang bearbeiten" }} - MediaMTX GUI{% endblock %}
{% block content %}
<h1>{{ "Neuer Zugang" if is_new else "Zugang bearbeiten: " + cred.username }}</h1>

<form method="post" action="{{ '/credentials/new' if is_new else '/credentials/' + cred.id|string + '/edit' }}" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% if is_new %}
    <div class="field">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" required>
    </div>
  {% endif %}

  <div class="field">
    <label for="password">Passwort {{ "" if is_new else "(leer lassen, um es nicht zu aendern)" }}</label>
    <input type="text" id="password" name="password" placeholder="{{ 'leer lassen fuer automatisch generiertes Passwort' if is_new else '' }}">
  </div>

  <div class="field">
    <label>Rechte</label>
    <label class="checkbox-row"><input type="checkbox" name="actions" value="publish" {{ "checked" if cred and "publish" in cred.actions_list() }}> Senden (publish)</label>
    <label class="checkbox-row"><input type="checkbox" name="actions" value="read" {{ "checked" if not cred or "read" in cred.actions_list() }}> Empfangen (read)</label>
    <label class="checkbox-row"><input type="checkbox" name="actions" value="playback" {{ "checked" if cred and "playback" in cred.actions_list() }}> Aufnahmen abrufen (playback)</label>
  </div>

  <div class="field">
    <label for="paths">Gueltig fuer Pfade (kommagetrennt, leer = alle Streams)</label>
    <input type="text" id="paths" name="paths" value="{{ cred.paths if cred else '' }}" placeholder="kamera1, cams/eingang">
  </div>

  <div class="field">
    <label for="ips">IP-Beschraenkung (kommagetrennt, leer = beliebig)</label>
    <input type="text" id="ips" name="ips" value="{{ cred.ips if cred else '' }}" placeholder="203.0.113.0/24">
  </div>

  <div class="field">
    <label for="notes">Notiz</label>
    <input type="text" id="notes" name="notes" value="{{ cred.notes if cred else '' }}" placeholder="z.B. Encoder Halle 1">
  </div>

  <button class="btn" type="submit">{{ "Zugang anlegen" if is_new else "Speichern" }}</button>
  <a class="btn secondary" href="/credentials">Abbrechen</a>
</form>
{% endblock %}
