# Beispiel fuer nginx als TLS-Reverse-Proxy vor der MediaMTX-GUI.
# Zertifikat z.B. per certbot (Let's Encrypt) erzeugen:
#   certbot certonly --nginx -d stream.example.com
# Datei nach /etc/nginx/sites-available/mediamtx-gui kopieren, Domain und
# Zertifikatspfade anpassen, dann:
#   ln -s /etc/nginx/sites-available/mediamtx-gui /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name stream.example.com;
    # Nur fuer die Let's-Encrypt-Domainvalidierung, alles andere auf HTTPS umleiten.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stream.example.com;

    ssl_certificate     /etc/letsencrypt/live/stream.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Die Anwendung setzt bereits eigene Sicherheits-Header (CSP, X-Frame-
    # Options, HSTS, ...) - hier reicht in der Regel eine schlanke Konfiguration.
    client_max_body_size 4m;

    # Der MediaMTX-Auth-Endpunkt ist nur fuer MediaMTX selbst gedacht
    # (direkt ueber Port 8080), nicht ueber den oeffentlichen Proxy.
    location /mtx/auth { return 404; }

    location / {
        # "mediamtx-gui" = Docker-Service-/Containername im gemeinsamen
        # Netzwerk. Laeuft nginx NICHT im selben Docker-Netzwerk, stattdessen
        # "127.0.0.1:8080" verwenden und den Port der GUI nur auf localhost
        # binden (z.B. "127.0.0.1:8080:8080" in der docker-compose.yml).
        proxy_pass http://mediamtx-gui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
